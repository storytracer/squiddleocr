[project]
name = "squiddleocr"
version = "0.3.0"
description = "PaddleX layout analysis, text detection and tables in front of kraken's PP-OCRv6 recogniser; DoclingDocument, Markdown, hOCR, ALTO, PAGE out"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    # kraken (segmentation, recognition, serialisation) on torch; torch pinned to the cached cu130 build on aarch64
    "kraken>=7.1.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "htrmopo",
    # ONNX Runtime for the PaddleX models: CUDA/TensorRT build on Linux and Windows (with the CUDA 13 runtime
    # libraries it loads from the nvidia-* pip packages; unused without an NVIDIA GPU), CoreML-capable build on macOS
    "onnxruntime-gpu>=1.23; sys_platform != 'darwin'",
    "nvidia-cuda-runtime>=13,<14; sys_platform != 'darwin'",
    "nvidia-cuda-nvrtc>=13,<14; sys_platform != 'darwin'",
    "nvidia-cublas>=13,<14; sys_platform != 'darwin'",
    "nvidia-cufft>=12; sys_platform != 'darwin'",
    "nvidia-curand>=10.4; sys_platform != 'darwin'",
    "nvidia-cudnn-cu13>=9; sys_platform != 'darwin'",
    "onnxruntime>=1.23; sys_platform == 'darwin'",
    "docling-core>=2.95",
    "numpy",
    "Pillow>=9.2",
    "opencv-python-headless>=4.8",
    "click>=8.1,<8.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# PaddleX models: PP-OCRv6 text detector, PP-DocLayout layout, SLANet tables
paddle = [
    "paddlepaddle>=3.2.2,<3.3",
    "paddlex[ocr-core]>=3.7",
]
test = ["pytest>=8"]

[project.scripts]
squiddle = "squiddleocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squiddleocr"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
# kraken with the PP-OCRv6 code (kraken.lib.ppocr); pinned to upstream main until a release ships it
kraken = { git = "https://github.com/mittagessen/kraken", rev = "a314f84f42da49a34079a4166305a7f378bb9c71" }

[tool.pytest.ini_options]
testpaths = ["tests"]
