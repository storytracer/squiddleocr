[project]
name = "squiddleocr"
version = "0.1.0"
description = "Package kraken's PP-OCRv6 text recognisers as drop-in PaddleOCR / PP-StructureV3 recognition models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "kraken>=7.1.0",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.3",
    "safetensors>=0.5",
    "numpy",
    "Pillow>=9.2",
    "pyyaml>=6",
    "click>=8.1,<8.3",
]

[project.optional-dependencies]
paddle = [
    "paddlepaddle>=3.2",
    "paddleocr>=3.7",
    "paddlex>=3.7",
]
x2paddle = ["x2paddle>=1.6"]
test = ["pytest>=8"]

[project.scripts]
squiddle = "squiddleocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squiddleocr"]

[tool.uv.sources]
kraken = { path = "/home/seb/dev/kraken", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
