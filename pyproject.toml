[project]
name = "squiddleocr"
version = "0.4.0.dev0"
description = "Document OCR for historical print: PaddleX layout, tables and formulas in front of kraken's PP-OCRv6 recogniser, or kraken's own pipeline; DoclingDocument, Markdown, hOCR, ALTO, PAGE out"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # the squiddle pipeline is a linecaster chain: linecaster (blocks, data model, serialisers) and its kraken
    # and PaddleX engines; path sources for development, pinned by commit for releases
    "linecaster",
    "linecaster-kraken",
    "linecaster-paddlex",
    # PaddleX pins OpenCV's GUI build; linecaster's stub swaps in the headless build of the same version (one cv2)
    "opencv-contrib-python",
    # kraken (segmentation, recognition, serialisation) on torch; torch pinned to the cached cu130 build on aarch64
    "kraken>=7.1.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    # kraken's models from their pinned Hugging Face mirrors (Zenodo throttles downloads)
    "huggingface-hub>=1.0",
    # ONNX Runtime for the PaddleX models: CUDA/TensorRT build on Linux and Windows (with the CUDA 13 runtime
    # libraries it loads from the nvidia-* pip packages; unused without an NVIDIA GPU), CoreML-capable build on macOS
    "onnxruntime-gpu>=1.23; sys_platform != 'darwin'",
    "nvidia-cuda-runtime>=13,<14; sys_platform != 'darwin'",
    "nvidia-cuda-nvrtc>=13,<14; sys_platform != 'darwin'",
    "nvidia-cublas>=13,<14; sys_platform != 'darwin'",
    "nvidia-cufft>=12; sys_platform != 'darwin'",
    "nvidia-curand>=10.4; sys_platform != 'darwin'",
    "nvidia-cudnn-cu13>=9; sys_platform != 'darwin'",
    "onnxruntime>=1.23; sys_platform == 'darwin'",
    "docling-core>=2.95",
    "numpy",
    "Pillow>=9.2",
    "click>=8.1,<8.3",
    "tqdm>=4.66",
    # Unicode line-break (UAX #14) and word-boundary (UAX #29) rules and properties for reflow
    "uniseg>=0.10",
]

[project.optional-dependencies]
# PaddleX models: PP-OCRv6 text detector, PP-DocLayout layout, the table pipeline (SLANeXt/SLANet,
# RT-DETR cells; the ocr extra for the pipeline class) on ONNX Runtime, and PP-FormulaNet formulas
# (PaddleX's transformers engine: Hugging Face transformers on torch)
paddle = [
    "paddlepaddle>=3.2.2,<3.3",
    "paddlex[ocr-core,ocr]>=3.7",
    "transformers>=5",
    "ftfy",
]
# eynollah (SBB's historical layout analyser) as a layout and line stage, run as a subprocess; its ONNX
# models come from Zenodo (squiddle models pull eynollah). psutil for the resource policy.
eynollah = [
    "eynollah>=0.9.2,<0.10",
    "psutil>=5.9",
]
test = ["pytest>=8"]

[project.scripts]
squiddle = "squiddleocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squiddleocr"]

[tool.uv]
# eynollah pins tensorrt_cu12 (CUDA 12 TensorRT libraries, sdist only, no aarch64 build); TensorRT is
# opt-in here (--eynollah-tensorrt with a system TensorRT / tensorrt-cu13), so the pin is dropped on
# every platform. Its other pins (onnxruntime-gpu[cuda,cudnn] = the CUDA 13 nvidia-* packages, ocrd)
# resolve on x86_64 and aarch64 as they are.
override-dependencies = ["tensorrt_cu12; sys_platform == 'never'"]
# the versions the goldens were recorded with (as linecaster's pipelines/transcribe_chain.py)
constraint-dependencies = ["lightning==2.6.6", "onnxruntime-gpu==1.29.0", "pillow==12.3.0"]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
# kraken with the PP-OCRv6 code (kraken.lib.ppocr) from our fork: upstream main (bb487219) plus the inference
# precision fix (forward passes inside Fabric's autocast, so --precision bf16-mixed takes effect); see NOTES
kraken = { git = "https://github.com/storytracer/kraken", rev = "48eecb78" }
# linecaster next to this checkout (~/dev/linecaster beside ~/dev/squiddleocr)
linecaster = { path = "../linecaster", editable = true }
linecaster-kraken = { path = "../linecaster/engines/kraken", editable = true }
linecaster-paddlex = { path = "../linecaster/engines/paddlex", editable = true }
opencv-contrib-python = { path = "../linecaster/stubs/opencv-contrib-python" }

[tool.pytest.ini_options]
testpaths = ["tests"]
